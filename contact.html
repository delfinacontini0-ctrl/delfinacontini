<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Delfina Contini</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root{
      --bg:#fff;--ink:#111;--line:rgba(17,17,17,.15);--pad:clamp(1.2rem,3vw,3rem);
      /* same vertical rhythm system as about.html / projects.html */
      --space-top:clamp(90px,18vw,140px);
      --space-section:clamp(2.75rem,6vw,4.5rem);
      --space-tight:clamp(1rem,2.5vw,1.75rem);
    }
    html,body{background:var(--bg);color:var(--ink);font-family:'DM Mono',monospace;margin:0}
    /* NAV (same as about.html / projects.html) */
    .topbar{position:fixed;left:0;right:0;top:0;background:var(--bg);border-bottom:none;z-index:1110}
    .topbar .container{width:100%;margin:0 auto;padding:28px calc(var(--pad) + 0.25rem);display:flex;align-items:center;justify-content:flex-end;gap:60px;position:relative}
    .nav-logo{position:absolute;left:calc(var(--pad) + 0.25rem);top:50%;transform:translateY(-50%);display:flex;align-items:center;color:#111}
    .nav-logo svg{height:40px;width:auto;display:block}
    .nav-links{display:flex;gap:24px;align-items:center;justify-content:flex-end;flex-wrap:nowrap;white-space:nowrap}
    .nav-links a{position:relative;display:inline-flex;align-items:center;font-family:'DM Mono',monospace;font-size:14px;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;color:var(--ink);transition:color .2s ease}
    .nav-links a::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:1px;background:var(--ink);transition:width .3s cubic-bezier(.22,1,.36,1)}
    .nav-links a:hover::after,.nav-links a:focus-visible::after{width:100%}
    .nav-links a.active::after{width:100%}
    .nav-links .sep{width:1px;height:12px;background:var(--line);display:inline-block}

    /* page container */
    main{max-width:1200px;margin:var(--space-top) auto 0;padding:0 var(--pad)}
    .nav-checkbox:checked ~ .topbar .menu-toggle span:nth-child(1){transform:translateY(8.5px) rotate(45deg)}
    .nav-checkbox:checked ~ .topbar .menu-toggle span:nth-child(2){opacity:0}
    .nav-checkbox:checked ~ .topbar .menu-toggle span:nth-child(3){transform:translateY(-8.5px) rotate(-45deg)}

    /* CONTACT HERO (centered, minimal) */
    .contact-hero{max-width:760px;margin:0 auto;text-align:center;padding-top:10px;padding-bottom:var(--space-section)}
    .pretitle{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
    .page-title{font-family:'Switzer',sans-serif;font-weight:700;font-size:clamp(2.4rem,6vw,4rem);line-height:.95;text-transform:uppercase;margin:0 0 28px}
    .lead{font-family:'Switzer',sans-serif;font-size:18px;line-height:1.6;max-width:46ch;margin:0 auto var(--space-tight)}

    .email-link{font-family:'Switzer',sans-serif;font-weight:700;font-size:clamp(1.4rem,4vw,2.2rem);color:var(--ink);text-decoration:none;display:inline-block;margin-bottom:14px}
    .email-link::after{content:'↗';margin-left:.3em;font-family:'DM Mono',monospace;font-weight:400;font-size:.55em;display:inline-block;transform:translate(0,0);transition:transform .3s cubic-bezier(.22,1,.36,1)}
    .email-link:hover,.email-link:focus-visible{text-decoration:underline;text-underline-offset:6px}
    .email-link:hover::after,.email-link:focus-visible::after{transform:translate(4px,-4px)}

    .location{font-family:'Switzer',sans-serif;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.6}

    .socials-wrap{padding-bottom:var(--space-tight)}

    .contact-strip{width:100vw;margin-left:calc(50% - 50vw);height:280px;margin-bottom:0}
    .contact-strip img{width:100%;height:280px;object-fit:cover;display:block}

    /* right fixed progress line */
    .right-line{position:fixed;right:14px;top:0;bottom:0;width:1px;background:var(--line);z-index:900}
    .right-line .dot{position:fixed;right:10px;width:8px;height:8px;background:#111;border-radius:50%;transform:translateY(0);transition:transform .25s ease}

    @media (max-width:600px){
      .topbar .nav-links{display:none}
      .topbar .container{padding-top:36px;padding-bottom:36px}
      .menu-toggle{position:absolute;top:50%;right:calc(var(--pad) + 0.25rem);transform:translateY(-50%)}
      .page-title{font-size:clamp(2.1rem,10vw,2.7rem)}
      .lead{font-size:16px}
      .contact-strip,.contact-strip img{height:180px}
    }
  </style>
</head>
<body>
  <input type="checkbox" id="navToggle" class="nav-checkbox" aria-hidden="true" tabindex="-1">

  <header class="topbar">
    <div class="container">
      <a class="nav-logo" href="index.html" aria-label="Home">
        <svg viewBox="0 0 48 42" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M14.5477 4.14182C14.0694 3.76354 12.38 2.65353 10.8429 2.06797C9.70813 1.63565 8.21659 2.02297 7.09017 2.82459C5.40107 4.02664 4.70456 6.35089 3.74787 8.89742C3.09802 10.6272 2.37964 13.3392 1.7778 16.5688C1.17597 19.7984 0.780238 23.4873 0.592293 25.8371C0.332992 29.079 0.654361 30.9456 1.12999 32.8289C1.62068 34.7719 2.66458 36.4165 3.64028 37.8291C4.59182 39.2066 5.96069 40.1141 7.19919 40.8257C8.30436 41.4607 9.60536 41.5046 10.8737 41.5C12.1891 41.4952 13.6607 40.4374 15.3796 38.7312C16.3524 37.7655 17.2322 36.319 18.1118 34.7573C18.9915 33.1957 19.7684 31.4916 20.6818 28.6981C21.5952 25.9047 22.6216 22.0733 23.3295 17.5185C24.0375 12.9637 24.396 7.80147 24.5462 4.88712C24.6965 1.97277 24.6276 1.46275 24.4895 0.869154C24.3513 0.275555 24.1459 -0.386164 24.3753 5.69495C24.6047 11.7761 25.2751 24.6201 24.4999 26.9172C23.7248 29.2143 21.4838 20.5753 20.2821 15.7907C19.0804 11.006 18.9859 10.3374 19.1337 9.885C19.4005 9.0678 22.48 8.19874 26.5392 6.93036C30.9327 5.55752 33.7608 6.18245 34.2996 6.36958C34.7454 6.52441 34.9683 7.2256 35.1982 8.30676C35.5163 9.80279 35.4795 12.1259 35.3394 15.0134C35.2677 16.4927 34.9537 17.9839 34.1862 20.1138C33.4188 22.2436 32.1459 24.9627 30.0394 28.3926C27.933 31.8225 25.0316 35.8808 23.533 37.887C22.0344 39.8932 22.0265 39.7242 22.1079 39.3837C22.1893 39.0432 22.3604 38.5363 24.6735 34.4556C26.9866 30.375 31.4366 22.7359 35.4914 16.6428C39.5463 10.5497 43.0713 6.23421 44.9881 3.91347C46.9049 1.59272 47.1067 1.39754 47.5 1.10879" stroke="black" stroke-linecap="round"/>
        </svg>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="projects.html">Projects</a>
        <span class="sep" aria-hidden="true"></span>
        <a href="about.html">About me</a>
        <span class="sep" aria-hidden="true"></span>
        <a href="contact.html" class="active">Contact me</a>
      </nav>
      <label class="menu-toggle" for="navToggle" role="button" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </label>
    </div>
  </header>

  <main>
    <section class="contact-hero reveal d1">
      <div class="pretitle">GET IN TOUCH</div>
      <h1 class="page-title">LET'S WORK<br>TOGETHER</h1>
      <p class="lead">Always open to new projects, collaborations, and good conversations about design.</p>
      <a class="email-link" href="mailto:delfinacontini0@gmail.com">delfinacontini0@gmail.com</a>
      <div class="location">Buenos Aires, Argentina</div>
    </section>

    <div class="socials-wrap reveal d3">
      <nav class="socials" aria-label="Social links">
        <a href="https://www.instagram.com/delfinacontini/" target="_blank" rel="noopener">Instagram <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7 17 L17 7 M8.5 7 L17 7 L17 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="https://www.behance.net/delfinacontini1" target="_blank" rel="noopener">Behance <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7 17 L17 7 M8.5 7 L17 7 L17 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a href="https://www.linkedin.com/in/delfina-contini" target="_blank" rel="noopener">Linked in <svg class="arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7 17 L17 7 M8.5 7 L17 7 L17 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </nav>
    </div>

    <div class="contact-strip">
      <img src="aboutme/textura1.jpg" alt="">
    </div>
  </main>

  <div class="right-line" aria-hidden="true"></div>
  <div class="right-line">
    <div class="dot" id="progressDot"></div>
  </div>

  <div class="cursor-dot" aria-hidden="true"></div>

  <button type="button" class="to-top" aria-label="Back to top">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 19V5M12 5L6 11M12 5L18 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <nav class="mobile-menu" id="mobileMenu" aria-hidden="true" aria-label="Mobile navigation">
    <a href="projects.html">Projects</a>
    <a href="about.html">About me</a>
    <a href="contact.html" class="active">Contact me</a>
  </nav>

  <script>
    (function(){
      var dot=document.getElementById('progressDot');
      var line=document.querySelector('.right-line');
      if(!dot||!line) return;
      function update(){
        var scrollTop=window.scrollY;
        var docHeight=document.documentElement.scrollHeight - window.innerHeight;
        var progress=docHeight>0? scrollTop/docHeight : 0;
        var top= Math.max(40, 40 + progress*(window.innerHeight - 90));
        dot.style.transform='translateY('+top+'px)';
      }
      update();window.addEventListener('scroll',update);window.addEventListener('resize',update);
    })();

    (function(){
      if(!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
      var dotCursor=document.querySelector('.cursor-dot');
      if(!dotCursor) return;
      document.body.classList.add('has-custom-cursor');
      function place(x,y){dotCursor.style.transform='translate('+x+'px,'+y+'px) translate(-50%,-50%)';}
      function updateColor(target){
        var inDark = target.closest('footer.site-footer');
        dotCursor.classList.toggle('white', !!inDark);
      }
      place(window.innerWidth/2,window.innerHeight/2);
      document.addEventListener('mousemove',function(e){
        place(e.clientX,e.clientY);
        updateColor(e.target);
      });
      document.querySelectorAll('a').forEach(function(el){
        el.addEventListener('mouseenter',function(){dotCursor.classList.add('is-link');updateColor(el);});
        el.addEventListener('mouseleave',function(){dotCursor.classList.remove('is-link');});
      });
      document.addEventListener('mouseleave',function(){dotCursor.style.opacity='0';});
      document.addEventListener('mouseenter',function(){dotCursor.style.opacity='1';});
    })();

    (function(){
      // mobile menu toggle: close when link clicked or Esc pressed
      var cb=document.getElementById('navToggle'), m=document.querySelector('.mobile-menu');
      if(!cb||!m) return;
      m.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){cb.checked=false;});});
      document.addEventListener('keydown',function(e){if(e.key==='Escape')cb.checked=false;});
    })();

    (function(){
      // sync .open class with checkbox so hamburger becomes X reliably
      var cb=document.getElementById('navToggle'), toggle=document.querySelector('.menu-toggle'), m=document.querySelector('.mobile-menu');
      if(!cb||!toggle) return;
      function sync(){ if(cb.checked) toggle.classList.add('open'); else toggle.classList.remove('open'); }
      cb.addEventListener('change', sync);
      toggle.addEventListener('click', function(){ setTimeout(sync, 10); });
      if(m) m.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', function(){ cb.checked=false; sync(); }); });
    })();

    (function(){
      // back to top: shows once you've scrolled down a bit
      var btn=document.querySelector('.to-top');
      if(!btn) return;
      function toggle(){ btn.classList.toggle('is-visible', window.scrollY > 400); }
      toggle();
      window.addEventListener('scroll', toggle);
      btn.addEventListener('click', function(){
        window.scrollTo({top:0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
      });
    })();
  </script>
</body>
</html>
